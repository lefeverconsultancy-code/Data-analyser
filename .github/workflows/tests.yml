name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.pandas && format(', pandas {0}', matrix.pandas) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.12"
            pandas: "2.2.*"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pin pandas
        if: matrix.pandas
        run: python -m pip install "pandas==${{ matrix.pandas }}"
      - name: Run tests (unit, reference cases, simulation checks)
        run: python -m pytest
